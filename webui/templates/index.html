<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speaker Inversion Builder</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="header-inner">
    <h1>Speaker Inversion Builder</h1>
    <span class="subtitle">for Irodori-TTS v3</span>
  </div>
</header>

<nav id="tab-nav">
  <button class="tab active" data-tab="data">データ準備</button>
  <button class="tab" data-tab="segments">セグメント</button>
  <button class="tab" data-tab="train">学習</button>
  <button class="tab" data-tab="test">テスト</button>
  <button class="tab" data-tab="settings">設定</button>
</nav>

<!-- ═══════════════════════ Tab: データ準備 ═══════════════════════ -->
<div id="tab-data" class="tab-content active">
  <div class="panel-row">

    <!-- Left: Upload + file list -->
    <div class="panel" style="flex:1;min-width:260px;max-width:360px">
      <h3>ファイル</h3>
      <div id="drop-area">
        <div class="drop-label">WAV / MP3 をドロップ<br>またはクリックして選択</div>
        <input type="file" id="file-input" multiple accept=".wav,.mp3" hidden>
      </div>
      <div id="file-list" class="item-list"></div>
    </div>

    <!-- Right: Waveform + controls -->
    <div class="panel" style="flex:2" id="waveform-panel">
      <h3>波形 <span id="waveform-filename" class="dim"></span></h3>
      <div id="waveform-container">
        <div id="waveform"></div>
        <div id="waveform-time" class="dim">ファイルを選択してください</div>
      </div>

      <div id="waveform-controls" class="hidden">
        <div class="ctrl-row">
          <button id="btn-play-pause" class="icon-btn">▶</button>
          <span id="time-display" class="dim">0.0 / 0.0 s</span>
          <button id="btn-loop" class="icon-btn" title="ループ再生">↩</button>
        </div>

        <div class="ctrl-section">
          <strong>セグメントに追加</strong>
          <div class="ctrl-row">
            <button id="btn-add-whole">ファイル全体を1セグメントに追加</button>
          </div>
        </div>

        <div class="ctrl-section">
          <strong>無音で自動分割</strong>
          <div class="ctrl-row wrap">
            <label>最小無音長 <input type="number" id="min-silence" value="700" min="100" max="5000" step="100"> ms</label>
            <label>無音閾値 <input type="number" id="silence-thresh" value="-40" min="-80" max="-5" step="1"> dB</label>
            <label>前後余白 <input type="number" id="keep-silence" value="200" min="0" max="1000" step="50"> ms</label>
            <button id="btn-split-silence" class="primary">自動分割実行</button>
          </div>
        </div>

        <div class="ctrl-section">
          <strong>手動分割</strong>
          <div class="ctrl-row wrap">
            <button id="btn-add-marker">現在位置にマーカー追加</button>
            <button id="btn-clear-markers">マーカーをクリア</button>
            <button id="btn-apply-split" class="primary">マーカーで分割実行</button>
          </div>
          <div id="markers-list" class="markers-list"></div>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- ═══════════════════════ Tab: セグメント ═══════════════════════ -->
<div id="tab-segments" class="tab-content">
  <div class="toolbar">
    <h3>セグメント一覧 <span id="seg-count" class="badge">0</span></h3>
    <div class="toolbar-actions">
      <button id="btn-transcribe-all" class="primary">全セグメント文字起こし</button>
      <span id="transcribe-progress" class="dim"></span>
    </div>
  </div>
  <div id="segment-list" class="item-list segment-grid"></div>
</div>

<!-- ═══════════════════════ Tab: 学習 ═══════════════════════ -->
<div id="tab-train" class="tab-content">
  <div class="train-sections">

    <section class="card">
      <h3><span class="step-badge">1</span> データセット構築</h3>
      <div class="form-grid">
        <label>ジョブ名 <input type="text" id="job-name" value="my_speaker"></label>
        <label>スピーカー名 <input type="text" id="speaker-name" placeholder="空欄でジョブ名と同じ"></label>
      </div>
      <div class="action-row">
        <button id="btn-build-dataset" class="primary">データセット構築</button>
        <span id="build-result" class="dim"></span>
      </div>
    </section>

    <section class="card">
      <h3><span class="step-badge">2</span> Manifest 準備（Latent 計算）</h3>
      <div class="form-grid">
        <label>Device
          <select id="prep-device"><option>cuda</option><option>cpu</option></select>
        </label>
        <label>正規化 dB <input type="text" id="normalize-db" value="-16.0"></label>
        <label>最大秒数 <input type="number" id="max-seconds" value="0" step="0.5" min="0"> <span class="dim">(0=無制限)</span></label>
      </div>
      <div class="action-row">
        <button id="btn-prepare-manifest" class="primary">Manifest 準備実行</button>
      </div>
    </section>

    <section class="card">
      <h3><span class="step-badge">3</span> 学習</h3>
      <div class="form-grid">
        <label>Device
          <select id="train-device"><option>cuda</option><option>cpu</option></select>
        </label>
        <label>Precision
          <select id="precision"><option>bf16</option><option>fp32</option></select>
        </label>
        <label>Max steps <input type="number" id="max-steps" value="3000" min="1"></label>
        <label>Batch size <input type="number" id="batch-size" value="16" min="1"></label>
        <label>Grad accum <input type="number" id="grad-accum" value="1" min="1"></label>
        <label>Speaker tokens <input type="number" id="tokens" value="16" min="1"></label>
        <label>Learning rate <input type="number" id="lr" value="0.01" step="0.001"></label>
        <label>Save every <input type="number" id="save-every" value="250" min="1"></label>
        <label style="grid-column:span 2">Init embedding <input type="text" id="init-embedding" placeholder="既存の .speaker.safetensors パス（任意）" style="width:100%"></label>
      </div>
      <div class="action-row">
        <button id="btn-train" class="primary">学習開始</button>
        <button id="btn-stop-train" class="danger hidden">停止</button>
      </div>
    </section>

  </div>

  <section class="card log-card">
    <h3>ログ</h3>
    <div id="train-log" class="log-output"></div>
  </section>
</div>

<!-- ═══════════════════════ Tab: テスト ═══════════════════════ -->
<div id="tab-test" class="tab-content">
  <div class="panel-row">

    <div class="panel card" style="flex:1">
      <h3>生成設定</h3>
      <div class="form-grid">
        <label style="grid-column:span 2">Speaker Embedding
          <div class="input-row">
            <select id="embed-select" style="flex:1">
              <option value="">-- 選択 --</option>
            </select>
            <button id="btn-refresh-runs" title="更新">⟳</button>
          </div>
        </label>
        <label style="grid-column:span 2">カスタムパス
          <input type="text" id="embed-path-custom" placeholder="直接パスを入力する場合">
        </label>
        <label style="grid-column:span 2">テキスト
          <textarea id="test-text" rows="4" placeholder="こんにちは。今日もよろしくお願いします。"></textarea>
        </label>
        <label>Steps <input type="number" id="gen-steps" value="40" min="1"></label>
        <label>Seed <input type="number" id="gen-seed" value="-1"> <span class="dim">(-1=random)</span></label>
      </div>
      <div class="action-row">
        <button id="btn-generate" class="primary">音声生成</button>
      </div>

      <div id="output-section" class="hidden" style="margin-top:16px">
        <h4>生成結果</h4>
        <audio id="output-audio" controls style="width:100%"></audio>
      </div>
    </div>

    <div class="panel card log-card" style="flex:1">
      <h3>ログ</h3>
      <div id="gen-log" class="log-output"></div>
    </div>

  </div>
</div>

<!-- ═══════════════════════ Tab: 設定 ═══════════════════════ -->
<div id="tab-settings" class="tab-content">
  <div class="card" style="max-width:680px">
    <h3>設定</h3>
    <div class="form-grid">
      <label style="grid-column:span 2">Irodori-TTS ルートパス
        <input type="text" id="set-irodori-root">
      </label>
      <label style="grid-column:span 2">Python 実行ファイル
        <input type="text" id="set-python-exe" placeholder="空欄でサーバーの Python を使用">
      </label>
      <label style="grid-column:span 2">ベースチェックポイント
        <input type="text" id="set-checkpoint" placeholder="空欄でデフォルト">
      </label>
    </div>
    <div class="action-row">
      <button id="btn-save-settings" class="primary">設定を保存</button>
      <span id="settings-status" class="dim"></span>
    </div>
  </div>
</div>

<!-- Mini player (shared) -->
<div id="mini-player" class="hidden">
  <audio id="mini-audio" controls></audio>
</div>

<script src="/static/wavesurfer.min.js"></script>
<script src="/static/app.js" defer></script>
</body>
</html>
